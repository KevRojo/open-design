name: Setup workspace
description: Restore pnpm cache and install dependencies

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24'
  pnpm-version:
    description: pnpm version to install
    required: false
    default: '10.33.2'
  runner-labels:
    description: JSON array of labels selected for this job's runs-on value
    required: false
    default: '[]'
  save-pnpm-cache:
    description: Save a missing pnpm cache after install; caller owns write authorization
    required: false
    default: 'false'
  cache-tools:
    description: Cache release dependency installation and the independently keyed tool build closure
    required: false
    default: 'false'
  install-profile:
    description: Dependency installation boundary (workspace|source-web|release-executor)
    required: false
    default: 'workspace'

runs:
  using: composite
  steps:
    - name: Validate install profile
      shell: bash
      run: |
        case "${{ inputs.install-profile }}" in
          workspace) ;;
          source-web|release-executor)
            if [ "${{ inputs.cache-tools }}" = "true" ]; then
              echo "${{ inputs.install-profile }} install profile cannot cache the full workspace tool closure" >&2
              exit 1
            fi
            ;;
          *)
            echo "unsupported setup-workspace install profile: ${{ inputs.install-profile }}" >&2
            exit 1
            ;;
        esac

    - name: Detect persistent pnpm store
      id: persistent-pnpm-store
      shell: bash
      env:
        RUNNER_LABELS_JSON: ${{ inputs.runner-labels }}
      run: |
        case "$RUNNER_LABELS_JSON" in
          *'"od-persistent-ci"'*) persistent_enabled=true ;;
          *) persistent_enabled=false ;;
        esac

        if [ "$persistent_enabled" = "true" ]; then
          if [ -z "${OPEN_DESIGN_CI_CACHE:-}" ]; then
            echo "runner-labels contains od-persistent-ci, but OPEN_DESIGN_CI_CACHE is not set" >&2
            exit 1
          fi
          store_dir="$OPEN_DESIGN_CI_CACHE/pnpm-store"
          mkdir -p "$store_dir"
          {
            echo "NPM_CONFIG_STORE_DIR=$store_dir"
            echo "npm_config_store_dir=$store_dir"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=$store_dir" >> "$GITHUB_OUTPUT"
        else
          # Force a stable home store path so actions/cache version hashes match
          # across fleets (hosted vs Nexu ARC). ARC may copy instead of hardlink;
          # that is acceptable for cache hit stability.
          store_dir="$HOME/.pnpm-store"
          mkdir -p "$store_dir"
          {
            echo "NPM_CONFIG_STORE_DIR=$store_dir"
            echo "npm_config_store_dir=$store_dir"
          } >> "$GITHUB_ENV"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "path=$store_dir" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.8
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      id: node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: '[resolve] Preparation inputs'
      if: ${{ inputs.cache-tools == 'true' }}
      id: tools
      shell: bash
      run: python3 .github/scripts/workspace.py

    - name: '[restore] Installed workspace dependencies'
      # Windows pnpm junctions do not reliably survive the tar cache round trip.
      # Restore the content store there and let pnpm recreate its links instead.
      if: ${{ inputs.cache-tools == 'true' && runner.os != 'Windows' }}
      id: dependencies-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          tools/*/node_modules
          shells/*/node_modules
          e2e/node_modules
        key: workspace-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ inputs.pnpm-version }}-${{ steps.tools.outputs.dependencies-key }}

    - name: Restore pnpm store
      id: pnpm-cache-restore
      if: ${{ steps.persistent-pnpm-store.outputs.enabled != 'true' && steps.dependencies-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      if: ${{ inputs.cache-tools != 'true' && inputs.install-profile == 'workspace' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: '[prepare] Web source dependencies'
      if: ${{ inputs.install-profile == 'source-web' }}
      shell: bash
      run: >-
        pnpm install --frozen-lockfile --ignore-scripts
        --filter @open-design/tools-pack...
        --filter @open-design/tools-release...
        --filter @open-design/web...

    - name: '[prepare] Release executor dependencies'
      if: ${{ inputs.install-profile == 'release-executor' }}
      shell: bash
      run: >-
        pnpm install --frozen-lockfile --ignore-scripts
        --filter @open-design/tools-pack...
        --filter @open-design/tools-release...

    - name: '[prepare] Workspace restore support'
      if: ${{ inputs.install-profile == 'source-web' || inputs.install-profile == 'release-executor' }}
      shell: bash
      run: >-
        pnpm --filter '@open-design/download...'
        --workspace-concurrency=1 --if-present run build

    - name: '[prepare] Workspace dependencies'
      if: ${{ inputs.cache-tools == 'true' && steps.dependencies-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        OPEN_DESIGN_POSTINSTALL_PHASE: dependencies
      run: pnpm install --frozen-lockfile

    - name: '[validate] Restored workspace dependencies'
      if: ${{ inputs.cache-tools == 'true' && steps.dependencies-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: pnpm run postinstall dependencies

    - name: '[cache] Installed workspace dependencies'
      if: ${{ inputs.cache-tools == 'true' && runner.os != 'Windows' && inputs.save-pnpm-cache == 'true' && steps.dependencies-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          tools/*/node_modules
          shells/*/node_modules
          e2e/node_modules
        key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}

    - name: '[restore] Tool build closure'
      if: ${{ inputs.cache-tools == 'true' }}
      id: tools-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.tools.outputs.paths }}
        key: workspace-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ inputs.pnpm-version }}-${{ steps.tools.outputs.key }}

    - name: '[build] Tool build closure'
      if: ${{ inputs.cache-tools == 'true' && steps.tools-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm run postinstall build

    - name: '[validate] Packaging tool readiness'
      if: ${{ inputs.cache-tools == 'true' && contains(env.OPEN_DESIGN_POSTINSTALL_TARGETS, 'tools/pack') }}
      shell: bash
      run: pnpm exec tools-pack --help

    - name: '[cache] Tool build closure'
      if: ${{ inputs.cache-tools == 'true' && inputs.save-pnpm-cache == 'true' && steps.tools-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.tools.outputs.paths }}
        key: ${{ steps.tools-cache.outputs.cache-primary-key }}

    - name: Save pnpm store
      if: ${{ inputs.save-pnpm-cache == 'true' && steps.persistent-pnpm-store.outputs.enabled != 'true' && steps.dependencies-cache.outputs.cache-hit != 'true' && steps.pnpm-cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
